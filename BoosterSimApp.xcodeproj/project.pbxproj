			shellPath = /bin/sh;
			shellScript = "FRAMEWORK_NAME=\"BoosterSimConnect\"
FRAMEWORKS_DIR=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources\"
IOS_PRODUCTS=\"${BUILD_DIR}/${CONFIGURATION}-iphonesimulator\"

mkdir -p \"${FRAMEWORKS_DIR}\"

# Check if framework already built (from separate xcodebuild step)
if [ -d \"${IOS_PRODUCTS}/${FRAMEWORK_NAME}.framework\" ]; then
  cp -R \"${IOS_PRODUCTS}/${FRAMEWORK_NAME}.framework\" \"${FRAMEWORKS_DIR}/\"
  echo \"Copied ${FRAMEWORK_NAME}.framework to ${FRAMEWORKS_DIR}\"
else
  # Try building it (may fail if parent build holds project lock)
  xcodebuild build \-project \"${PROJECT_FILE_PATH}\" \-scheme \"${FRAMEWORK_NAME}\" \-configuration \"${CONFIGURATION}\" \-sdk iphonesimulator \-quiet 2>/dev/null
  if [ -d \"${IOS_PRODUCTS}/${FRAMEWORK_NAME}.framework\" ]; then
    cp -R \"${IOS_PRODUCTS}/${FRAMEWORK_NAME}.framework\" \"${FRAMEWORKS_DIR}/\"
    echo \"Copied ${FRAMEWORK_NAME}.framework to ${FRAMEWORKS_DIR}\"
  else
    echo \"Note: ${FRAMEWORK_NAME}.framework not built. Build separately with: xcodebuild -scheme ${FRAMEWORK_NAME} -sdk iphonesimulator build\"
  fi
fi";
