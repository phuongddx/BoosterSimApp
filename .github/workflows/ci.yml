name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: BoosterSimApp.xcodeproj
  SCHEME: BoosterSimApp

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Fix Project Settings for CI
        run: |
          # Fix deployment target for macOS 26 SDK
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 26.2/MACOSX_DEPLOYMENT_TARGET = 26.3/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable MainActor isolation default (causes concurrency errors in CI)
          sed -i '' 's/SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor/SWIFT_DEFAULT_ACTOR_ISOLATION = nonisolated/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable upcoming features
          sed -i '' 's/SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY = YES/SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY = NO/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable approachable concurrency
          sed -i '' 's/SWIFT_APPROACHABLE_CONCURRENCY = YES/SWIFT_APPROACHABLE_CONCURRENCY = NO/g' ${{ env.PROJECT }}/project.pbxproj

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          xcodebuild build \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -configuration ${{ matrix.configuration }} \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Check Build Warnings
        if: matrix.configuration == 'Debug'
        run: |
          WARNINGS=$(find DerivedData -name "*.xcresult" -exec xcrun xcresulttool get --format json --path {} \; 2>/dev/null | grep -c "warning" || true)
          echo "Build warnings: $WARNINGS"

  test:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Fix Project Settings for CI
        run: |
          # Fix deployment target for macOS 26 SDK
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 26.2/MACOSX_DEPLOYMENT_TARGET = 26.3/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable MainActor isolation default (causes concurrency errors in CI)
          sed -i '' 's/SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor/SWIFT_DEFAULT_ACTOR_ISOLATION = nonisolated/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable upcoming features
          sed -i '' 's/SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY = YES/SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY = NO/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable approachable concurrency
          sed -i '' 's/SWIFT_APPROACHABLE_CONCURRENCY = YES/SWIFT_APPROACHABLE_CONCURRENCY = NO/g' ${{ env.PROJECT }}/project.pbxproj

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run Tests
        run: |
          xcodebuild test \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath TestResults \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      - name: Upload Code Coverage
        if: success()
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json 2>/dev/null || true

      - name: Upload Coverage Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
          retention-days: 7

  build-benchmark:
    name: Build Time Benchmark
    runs-on: macos-26
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Fix Project Settings for CI
        run: |
          # Fix deployment target for macOS 26 SDK
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 26.2/MACOSX_DEPLOYMENT_TARGET = 26.3/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable MainActor isolation default (causes concurrency errors in CI)
          sed -i '' 's/SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor/SWIFT_DEFAULT_ACTOR_ISOLATION = nonisolated/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable upcoming features
          sed -i '' 's/SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY = YES/SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY = NO/g' ${{ env.PROJECT }}/project.pbxproj
          # Disable approachable concurrency
          sed -i '' 's/SWIFT_APPROACHABLE_CONCURRENCY = YES/SWIFT_APPROACHABLE_CONCURRENCY = NO/g' ${{ env.PROJECT }}/project.pbxproj

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Benchmark Build Time
        run: |
          START_TIME=$(date +%s)
          xcodebuild build \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "## Build Time Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "Build completed in ${DURATION}s" >> $GITHUB_STEP_SUMMARY
          echo "build_duration_seconds=${DURATION}" >> $GITHUB_ENV
