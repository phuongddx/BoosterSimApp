name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: BoosterSimApp.xcodeproj
  SCHEME: BoosterSimApp

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          xcodebuild build \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -configuration ${{ matrix.configuration }} \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO

  build-benchmark:
    name: Build Time Benchmark
    runs-on: macos-26
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Benchmark Build Time
        run: |
          START_TIME=$(date +%s)
          xcodebuild build \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "## Build Time Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "Build completed in ${DURATION}s" >> $GITHUB_STEP_SUMMARY
          echo "build_duration_seconds=${DURATION}" >> $GITHUB_ENV
