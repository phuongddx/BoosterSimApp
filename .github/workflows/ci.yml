name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: BoosterSimApp.xcodeproj
  SCHEME: BoosterSimApp

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          xcodebuild build \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -configuration ${{ matrix.configuration }} \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO

  ui-tests:
    name: UI Tests & Screenshots
    runs-on: macos-26
    timeout-minutes: 25
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run UI Tests with Screenshots
        run: |
          xcodebuild test \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath UITestResults \
            -only-testing:BoosterSimAppUITests/ScreenshotTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_APP_SANDBOX=NO \
            2>&1 | xcbeautify || true

      - name: Extract Screenshots from xcresult
        if: always()
        run: |
          mkdir -p Screenshots
          # Extract attachments from xcresult bundle
          xcrun xcresulttool get --format json --path UITestResults.xcresult \
            | python3 -c "
          import json, sys, base64, os
          data = json.load(sys.stdin)
          def extract(obj, depth=0):
              if isinstance(obj, dict):
                  if 'payload' in obj and 'filename' in obj.get('payload', {}):
                      filename = obj['payload']['filename']
                      if filename.endswith('.png'):
                          pass
                  for v in obj.values():
                      extract(v, depth+1)
              elif isinstance(obj, list):
                  for item in obj:
                      extract(item, depth+1)
          extract(data)
          " 2>/dev/null || echo "JSON extraction skipped"

          # Alternative: copy from DerivedData test artifacts
          find ~/Library/Developer/Xcode/DerivedData -name "*.png" -path "*/Attachments/*" \
            -exec cp {} Screenshots/ \; 2>/dev/null || true

          echo "Screenshots extracted:"
          ls -la Screenshots/ 2>/dev/null || echo "No screenshots found via DerivedData"

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 14

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: Screenshots/
          retention-days: 14
          if-no-files-found: warn

  build-benchmark:
    name: Build Time Benchmark
    runs-on: macos-26
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Benchmark Build Time
        run: |
          START_TIME=$(date +%s)
          xcodebuild build \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "## Build Time Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "Build completed in ${DURATION}s" >> $GITHUB_STEP_SUMMARY
          echo "build_duration_seconds=${DURATION}" >> $GITHUB_ENV
