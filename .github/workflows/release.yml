name: Release

# ---------------------------------------------------------------------------
# Required repository secrets (values NEVER live in this file — see
# docs/deployment-guide.md "CI release secrets" for how to produce each one):
#
#   APPLE_CERTIFICATE_P12             "Developer ID Application: Doan Duy
#                                     Phuong (K2TYLYAWMK)" exported as .p12
#                                     from Keychain Access, base64-encoded
#                                     (base64 -i DeveloperID.p12 | pbcopy)
#   APPLE_CERTIFICATE_P12_PASSPHRASE  the .p12 export passphrase
#   ASC_KEY_ID                        App Store Connect API key id (notarytool
#                                     credentials, API-key form)
#   ASC_ISSUER_ID                     App Store Connect API issuer id
#   ASC_KEY_P8                        the downloaded AuthKey_<id>.p8 contents,
#                                     base64-encoded
#   SPARKLE_PRIVATE_KEY               Sparkle EdDSA private key exported from
#                                     the release machine's keychain via
#                                     `generate_keys -x`, base64-encoded
# ---------------------------------------------------------------------------

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # creating the GitHub Release and uploading its assets

env:
  PROJECT: BoosterSimApp.xcodeproj
  SCHEME: BoosterSimApp
  NOTARY_PROFILE: booster-notary

jobs:
  release:
    name: Sign, notarize, DMG, appcast
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoosterSimApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Import Developer ID certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_P12_PASSPHRASE: ${{ secrets.APPLE_CERTIFICATE_P12_PASSPHRASE }}
        run: |
          KEYCHAIN="release-keychain-$GITHUB_RUN_ID.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          CERT_DIR="$(mktemp -d)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$CERT_DIR/DeveloperID.p12"
          security create-keychain -p "$APPLE_CERTIFICATE_P12_PASSPHRASE" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_CERTIFICATE_P12_PASSPHRASE" "$KEYCHAIN"
          security import "$CERT_DIR/DeveloperID.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_P12_PASSPHRASE" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$APPLE_CERTIFICATE_P12_PASSPHRASE" "$KEYCHAIN"

      - name: Store notarytool credentials (App Store Connect API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_DIR="$(mktemp -d)"
          printf '%s' "$ASC_KEY_P8" | base64 --decode -o "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --key "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build, sign, notarize, staple, DMG (scripts/build-release.sh)
        run: scripts/build-release.sh

      - name: Generate signed appcast.xml (Sparkle generate_appcast)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Sparkle 2.9.6 ships the tool as a BINARY SPM artifact:
          # SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast.
          # The checkouts tree contains only the tool's Swift sources (its
          # bin/ holds just old_dsa_scripts), so search all of SourcePackages.
          GENERATE_APPCAST="$(find SourcePackages -path '*Sparkle*/bin/generate_appcast' -type f | head -1)"
          if [ -z "$GENERATE_APPCAST" ]; then
            echo "ERROR: generate_appcast not found under SourcePackages (expected SourcePackages/artifacts/sparkle/Sparkle/bin/)" >&2
            exit 1
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" | base64 --decode -o "$KEY_FILE"
          # generate_appcast takes a DIRECTORY OF UPDATE ARCHIVES (dmg/zip),
          # not an .app bundle, and writes appcast.xml beside the archives with
          # the enclosure pointing at the archive's file name. Shipping the DMG
          # into build/appcast keeps enclosure "BoosterSim.dmg" resolvable
          # against the feed URL (releases/latest/download/<asset>).
          mkdir -p build/appcast
          cp build/BoosterSim.dmg build/appcast/
          "$GENERATE_APPCAST" --ed-key-file "$KEY_FILE" build/appcast
          ls -la build/appcast

      - name: Create GitHub Release (DMG + appcast.xml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "BoosterSim $GITHUB_REF_NAME" \
            --generate-notes \
            build/appcast/BoosterSim.dmg \
            build/appcast/appcast.xml

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
